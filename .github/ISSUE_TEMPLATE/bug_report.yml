name: Bug Report
description: Report a bug or unexpected behavior in cmdRunner
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out this form as completely as possible.
  - type: input
    id: version
    attributes:
      label: Extension Version
      description: What version of cmdRunner are you using?
      placeholder: "e.g. 0.1.0"
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code Version
      description: What version of VS Code are you using?
      placeholder: "e.g. 1.85.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g. macOS 14.0, Windows 11, Ubuntu 22.04"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open a workspace with .cmdrunner
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: .cmdrunner Configuration (if relevant)
      description: Paste your .cmdrunner file (remove secrets!)
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant logs from the Developer Tools console or audit log.
      render: shell
